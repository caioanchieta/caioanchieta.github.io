<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X/Y Coords Distance Calculator</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--accent-color);
        }

        .coord-group {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #252525;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .coord-group h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #aaa;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            margin-bottom: 5px;
            color: #888;
        }

        input[type="number"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #121212;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .checkbox-group input {
            margin-right: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .results {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .result-box {
            text-align: center;
            flex: 1;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Cood Calculator</h2>

        <div class="coord-group">
            <h3>Your current position</h3>
            <div class="input-row">
                <div class="input-field">
                    <label for="cur-x">X</label>
                    <input type="number" id="cur-x" step="0.01" placeholder="Ex: 98.42">
                </div>
                <div class="input-field">
                    <label for="cur-y">Y</label>
                    <input type="number" id="cur-y" step="0.01" placeholder="Ex: 109.58">
                </div>
            </div>
        </div>

        <div class="coord-group">
            <h3>Target</h3>
            <div class="input-row">
                <div class="input-field">
                    <label for="tgt-x">X</label>
                    <input type="number" id="tgt-x" step="0.01" placeholder="Ex: 100.49">
                </div>
                <div class="input-field">
                    <label for="tgt-y">Y</label>
                    <input type="number" id="tgt-y" step="0.01" placeholder="Ex: 108.24">
                </div>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="invert-y" checked>
            <label for="invert-y">Invert Y axis (Moving to north decreases Y)</label>
        </div>

        <button onclick="calculate()">Calculate</button>

        <div class="results">
            <div class="result-box">
                <div>DISTANCE</div>
                <div class="result-value" id="res-dist">0 m</div>
            </div>
            <div class="result-box">
                <div>AZIMUTh</div>
                <div class="result-value" id="res-azi">000°</div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const curX = parseFloat(document.getElementById('cur-x').value);
            const curY = parseFloat(document.getElementById('cur-y').value);
            const tgtX = parseFloat(document.getElementById('tgt-x').value);
            const tgtY = parseFloat(document.getElementById('tgt-y').value);
            const invertY = document.getElementById('invert-y').checked;

            // ValidaTE
            if (isNaN(curX) || isNaN(curY) || isNaN(tgtX) || isNaN(tgtY)) {
                alert("Please, fill correctly.");
                return;
            }

            // Dif
            const dx = tgtX - curX;
            let dy = tgtY - curY;

            if (invertY) {
                dy = -dy; 
            }

            // Pitágoras
            const distance = Math.sqrt((dx * dx) + (dy * dy)) * 100;


            let azimuth = Math.atan2(dx, dy) * (180 / Math.PI);


            if (azimuth < 0) {
                azimuth += 360;
            }

            document.getElementById('res-dist').innerText = distance.toFixed(0) + " m";

            let formattedAzimuth = Math.round(azimuth).toString().padStart(3, '0');
            document.getElementById('res-azi').innerText = formattedAzimuth + "°";
        }
    </script>
</body>
</html>
