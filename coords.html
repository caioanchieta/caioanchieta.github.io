<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X/Y Coords Distance Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --inner-bg: #242424;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --accent-color: #e67e22;
            --border-color: #333333;
            --input-bg: #121212;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .wd-container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
        }

        .wd-container h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--text-color);
            font-weight: 600;
        }

        .wd-box {
            margin-bottom: 20px;
            padding: 15px;
            background-color: var(--inner-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .wd-box h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .wd-flex-row {
            display: flex;
            gap: 12px;
        }

        .wd-input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .wd-input-wrapper label {
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .wd-input-wrapper input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .wd-input-wrapper input[type="number"]:focus {
            border-color: var(--accent-color);
        }

        .wd-check-wrapper {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .wd-check-wrapper input {
            margin-right: 10px;
            accent-color: var(--accent-color);
        }

        .wd-button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .wd-button:hover {
            background-color: #d35400;
            transform: translateY(-1px);
        }

        .wd-button:active {
            transform: translateY(1px);
        }

        .wd-output-area {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .wd-output-item {
            text-align: center;
            flex: 1;
        }

        .wd-output-item div:first-child {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .wd-val {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="wd-container">
        <h2>Coord Distance Calculator</h2>

        <div class="wd-box">
            <h3>Your current position</h3>
            <div class="wd-flex-row">
                <div class="wd-input-wrapper">
                    <label for="cur-x">X</label>
                    <input type="number" id="cur-x" step="0.01" placeholder="Ex: 98.42">
                </div>
                <div class="wd-input-wrapper">
                    <label for="cur-y">Y</label>
                    <input type="number" id="cur-y" step="0.01" placeholder="Ex: 109.58">
                </div>
            </div>
        </div>

        <div class="wd-box">
            <h3>Target</h3>
            <div class="wd-flex-row">
                <div class="wd-input-wrapper">
                    <label for="tgt-x">X</label>
                    <input type="number" id="tgt-x" step="0.01" placeholder="Ex: 100.49">
                </div>
                <div class="wd-input-wrapper">
                    <label for="tgt-y">Y</label>
                    <input type="number" id="tgt-y" step="0.01" placeholder="Ex: 108.24">
                </div>
            </div>
        </div>

        <div class="wd-check-wrapper">
            <input type="checkbox" id="invert-y" checked>
            <label for="invert-y">Invert Y axis (Moving to north decreases Y)</label>
        </div>

        <button class="wd-button" onclick="calculate()">Calculate</button>

        <div class="wd-output-area">
            <div class="wd-output-item">
                <div>DISTANCE</div>
                <div class="wd-val" id="res-dist">0 m</div>
            </div>
            <div class="wd-output-item">
                <div>AZIMUTH</div>
                <div class="wd-val" id="res-azi">000°</div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const curX = parseFloat(document.getElementById('cur-x').value);
            const curY = parseFloat(document.getElementById('cur-y').value);
            const tgtX = parseFloat(document.getElementById('tgt-x').value);
            const tgtY = parseFloat(document.getElementById('tgt-y').value);
            const invertY = document.getElementById('invert-y').checked;

            if (isNaN(curX) || isNaN(curY) || isNaN(tgtX) || isNaN(tgtY)) {
                alert("Please, fill correctly.");
                return;
            }

            const dx = tgtX - curX;
            let dy = tgtY - curY;

            if (invertY) {
                dy = -dy; 
            }

            const distance = Math.sqrt((dx * dx) + (dy * dy)) * 100;
            let azimuth = Math.atan2(dx, dy) * (180 / Math.PI);

            if (azimuth < 0) {
                azimuth += 360;
            }

            document.getElementById('res-dist').innerText = distance.toFixed(0) + " m";
            
            let formattedAzimuth = Math.round(azimuth).toString().padStart(3, '0');
            document.getElementById('res-azi').innerText = formattedAzimuth + "°";
        }
    </script>
</body>
</html>
